# A segment with no room or ICU charge. The bill has no room, nursing or
# diet line, so the segment has no ratio: scaling is skipped there, and the
# engine raises no_room_charge so a reviewer looks for the room charge.
#
# Sum insured ₹3,00,000. Stay 15 to 16 September, one room segment.
#
# Step 2, daily caps: no bucket line, so nothing is capped.
# Step 3, proportionate deduction: no ratio, so L01 and L02 keep their
#   amounts. no_room_charge. L03 pharmacy is exempt.
# Subtotal: ₹25,000 + ₹10,000 + ₹8,000 = ₹43,000.
# Step 6, co-payment: 5% of ₹43,000 = ₹2,150. Every share is exact:
#   L01 ₹1,250, L02 ₹500, L03 ₹400.
# Payable: ₹43,000 − ₹2,150 = ₹40,850.

