# A cataract done as day care, in a same-day stay, over its sub-limit.
#
# Sum insured ₹1,00,000. The cataract limit is the lower of 25% (₹25,000)
# and ₹40,000, per eye per policy year: ₹25,000, with nothing used yet on
# the right eye. Cataract has a 24-month wait (Excl02); cover has run since
# 1 April 2022, so it ended on 1 April 2024, before this claim.
# The stay is 12 August only: one segment of one day, with a day-care bed
# billed for 1 day. The room cap is the lower of 2% (₹2,000) and ₹5,000:
# ₹2,000 a day.
#
# Step 2, daily caps: L01 billed ₹1,500, under 1 × ₹2,000. No deduction.
# Step 3, proportionate deduction: the ratio is ₹1,500 ÷ ₹1,500 = 1, so
#   nothing is scaled.
# Step 4, sub-limits: every line is tied to the right eye's cataract.
#   Tied total ₹39,500, limit ₹25,000: the ₹14,500 (1,450,000 paise)
#   reduction is spread by amount:
#     L01   55,063.2911   L02 660,759.4937   L03 440,506.3291
#     L04  220,253.1646   L05  73,417.7215
#   The floors add to 1,449,998. The 2 paise left go to L05 (.7215) and
#   L02 (.4937). sub-limit-cataract: 55,063, 660,760, 440,506, 220,253 and
#   73,418. The lines are now 94,937 + 1,139,240 + 759,494 + 379,747 +
#   126,582 = 2,500,000 paise.
# Step 6, co-payment: 5% of ₹25,000 = ₹1,250 (125,000 paise), spread:
#     L01 4,746.85   L02 56,962.00   L03 37,974.70   L04 18,987.35
#     L05 6,329.10
#   The floors add to 124,998; the 2 paise left go to L01 (.85) and
#   L03 (.70).
# Payable: ₹25,000 − ₹1,250 = ₹23,750.
# Ledger: the right eye's cataract use is what its lines were admitted at
# before the co-payment, ₹25,000, so its limit is used up for the year.

