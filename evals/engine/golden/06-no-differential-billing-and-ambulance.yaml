# A hospital that doesn't follow differential billing: the room is still
# capped, but nothing is scaled (C.I.1 Note 3). The road ambulance is over
# its ₹2,000 limit.
#
# Sum insured ₹3,00,000, so the room cap is the lower of 2% (₹6,000) and
# ₹5,000: ₹5,000 a day. Stay 1 to 3 December: 3 calendar days, 2 billed.
#
# Step 2, daily caps: L01 billed 2 × ₹7,000 = ₹14,000; capped at
#   2 × ₹5,000 = ₹10,000. daily-cap-room ₹4,000 on L01.
# Step 3, proportionate deduction: skipped, because the hospital doesn't
#   follow differential billing. L02 keeps its ₹25,000. Nothing is flagged:
#   the facts answer the question.
# Step 4, sub-limits: road ambulance at most ₹2,000 per hospitalisation
#   (C.I.1.1(v)). L03 billed ₹3,000: sub-limit-road-ambulance ₹1,000.
# Subtotal: ₹10,000 + ₹25,000 + ₹2,000 + ₹4,000 = ₹41,000.
# Step 6, co-payment: 5% of ₹41,000 = ₹2,050. Every share is exact:
#   L01 ₹500, L02 ₹1,250, L03 ₹100, L04 ₹200.
# Payable: ₹41,000 − ₹2,050 = ₹38,950.

