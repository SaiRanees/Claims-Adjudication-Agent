    - {line: L02, rule: co-payment, paise: 15000}
    - {line: L03, rule: co-payment, paise: 100000}
  flags:
    - {code: room_days_mismatch, line: L01}
    - {code: room_days_mismatch, line: L02}
  claim_payable_paise: 2755000
  ledger:
    paid_paise: 2755000
