# A room day billed twice, under the cap. L01 bills the room for 27 and
# 28 October; L02 bills it again for 28 October. Together they cover 2
# days, one fewer than the segment's 3, so the days check passes, and the
# ₹9,000 is under the 2 × ₹5,000 allowance, so the cap doesn't catch it
# either. Two room-rent lines that cover the same day raise
# room_days_mismatch on both, so a person sees the day billed twice.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day. Stay 27 to 29
# October: 3 calendar days.
#
# Step 2, daily caps: the room lines cover 2 days, billed ₹9,000; the
#   allowance is min(2, 3) × ₹5,000 = ₹10,000. No deduction.
#   room_days_mismatch on L01 and L02: both cover 28 October.
# Step 3, proportionate deduction: ratio ₹5,000 × 2 days billed ÷ ₹9,000,
#   at most 1, so 1. L03 isn't scaled.
# Subtotal: ₹6,000 + ₹3,000 + ₹20,000 = ₹29,000.
# Step 6, co-payment: 5% of ₹29,000 = ₹1,450. Every share is exact:
#   L01 ₹300, L02 ₹150, L03 ₹1,000.
# Payable: ₹29,000 − ₹1,450 = ₹27,550, with the duplicate day paid until a
#   person decides.

