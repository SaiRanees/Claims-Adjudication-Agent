  differential_billing: yes
  lines:
    - {id: L01, category: room-rent, service_date: 2025-10-27, quantity: 2, unit_price_paise: 300000, amount_paise: 600000}
    # The room again, for 28 October.
    - {id: L02, category: room-rent, service_date: 2025-10-28, quantity: 1, unit_price_paise: 300000, amount_paise: 300000}
    - {id: L03, category: professional-fees, service_date: 2025-10-28, quantity: 1, unit_price_paise: 2000000, amount_paise: 2000000}

expected:
  lines:
    - {id: L01, payable_paise: 570000}
    - {id: L02, payable_paise: 285000}
    - {id: L03, payable_paise: 1900000}
  adjustments:
