# Annexure A List I, optional items: laundry charges, item 11, "Not
# Payable". C.I.7 places the expenses the policy doesn't cover in List I.
# The line pays nothing, and its adjustment cites the list.
#
# The room is over its cap, so other lines are scaled. L02 is in a scaled
# category, but step 1 has already taken it to zero, so it gets no ratio
# deduction and no share of the co-payment.
#
# Sum insured ₹4,00,000: the room cap is the lower of 2% (₹8,000) and
# ₹5,000, so ₹5,000 a day. Stay 5 to 7 May: 3 calendar days, 2 billed at
# ₹6,000.
#
# Step 1, listed items: L02 ₹600 → annexure-a-list-i ₹600.
# Step 2, daily caps: L01 ₹12,000 capped at 2 × ₹5,000 = ₹10,000.
#   daily-cap-room ₹2,000.
# Step 3, proportionate deduction: ratio ₹10,000 ÷ ₹12,000 = 5/6.
#   L03 1,800,000 × 1,000,000 ÷ 1,200,000 = 1,500,000 exactly, so
#   proportionate-deduction-room ₹3,000. L04 pharmacy is exempt.
# Subtotal: ₹10,000 + ₹0 + ₹15,000 + ₹5,000 = ₹30,000.
# Step 6, co-payment: 5% of ₹30,000 = ₹1,500. Every share is exact:
#   L01 ₹500, L02 nothing, L03 ₹750, L04 ₹250.
# Payable: ₹30,000 − ₹1,500 = ₹28,500.

