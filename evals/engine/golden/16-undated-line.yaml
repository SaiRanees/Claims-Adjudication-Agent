# An undated line in a stay with more than one rate. L04 has no date, so it
# takes the lowest ratio in the stay and raises undated_line: its interim
# figure is never above any reading of the bill, and a reviewer supplies the
# date.
#
# Sum insured ₹2,00,000, so the room cap is the lower of 2% (₹4,000) and
# ₹5,000: ₹4,000 a day. Stay 9 to 14 February, in two rooms:
#   a single room, 9 to 11 February: 3 calendar days, billed for 3 at
#   ₹6,000;
#   a twin-sharing room, 12 to 14 February: 3 calendar days, billed for 2 at
#   ₹5,000.
#
# Step 2, daily caps, per segment:
#   single room: L01 ₹18,000 capped at 3 × ₹4,000 = ₹12,000.
#     daily-cap-room ₹6,000.
#   twin sharing: L02 ₹10,000 capped at 2 × ₹4,000 = ₹8,000.
#     daily-cap-room ₹2,000.
# Step 3, proportionate deduction: the single room's ratio is
#   ₹12,000 ÷ ₹18,000 = 2/3, the twin-sharing room's ₹8,000 ÷ ₹10,000 = 80%.
#   L03, dated 13 February, takes 80%: ₹10,000 × 80% = ₹8,000, so
#     proportionate-deduction-room ₹2,000.
#   L04, undated, takes the lower, 2/3: 1,200,000 × 1,200,000 ÷ 1,800,000 =
#     800,000 exactly, so proportionate-deduction-room ₹4,000. At 80% it
#     would pay ₹9,600.
#   L05 diagnostics is exempt.
# Subtotal: ₹12,000 + ₹8,000 + ₹8,000 + ₹8,000 + ₹6,000 = ₹42,000.
# Step 6, co-payment: 5% of ₹42,000 = ₹2,100. Every share is exact:
#   L01 ₹600, L02 ₹400, L03 ₹400, L04 ₹400, L05 ₹300.
# Payable: ₹42,000 − ₹2,100 = ₹39,900.

