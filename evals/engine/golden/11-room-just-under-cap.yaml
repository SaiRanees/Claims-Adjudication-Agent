# A room rate one rupee under the cap, the pair of case 03: the cap deducts
# nothing, the ratio is exactly one, and no line is scaled.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day. Stay 13 to 15
# October: 3 calendar days, 2 billed at ₹4,999.
#
# Step 2, daily caps: L01 billed 2 × ₹4,999 = ₹9,998, under 2 × ₹5,000 =
#   ₹10,000. No deduction.
# Step 3, proportionate deduction: ratio 999,800 ÷ 999,800 = 1, so L02 and
#   L03 keep their amounts, and a zero adjustment isn't emitted. L04
#   pharmacy is exempt.
# Subtotal: 999,800 + 4,000,000 + 1,500,000 + 800,000 = 7,299,800 paise.
# Step 6, co-payment: 5% of 7,299,800 = 364,990 paise, exactly. Every share
#   is exact: L01 49,990, L02 200,000, L03 75,000, L04 40,000.
# Payable: 7,299,800 − 364,990 = 6,934,810 paise (₹69,348.10).
#
# Case 03 bills the same lines with the room at ₹5,001 a day: 400 paise more
# billed, 855 paise less paid.

