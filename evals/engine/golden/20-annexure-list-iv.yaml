# Annexure A List IV, items subsumed into the costs of treatment:
# admission and registration charges, item 1, "Not Payable". The line pays
# nothing, and its adjustment cites the list.
#
# Sum insured ₹3,00,000: the room cap is the lower of 2% (₹6,000) and
# ₹5,000, so ₹5,000 a day; the room is ₹2,500. Stay 25 to 28 August:
# 4 calendar days, 3 billed.
#
# Step 1, listed items: L02 ₹1,000 → annexure-a-list-iv ₹1,000.
# Step 2, daily caps: L01 ₹7,500, under 3 × ₹5,000 = ₹15,000. No deduction.
# Step 3, proportionate deduction: ratio ₹7,500 ÷ ₹7,500 = 1, so nothing is
#   scaled.
# Subtotal: ₹7,500 + ₹0 + ₹12,500 + ₹7,000 = ₹27,000.
# Step 6, co-payment: 5% of ₹27,000 = ₹1,350. Every share is exact:
#   L01 ₹375, L02 nothing, L03 ₹625, L04 ₹350.
# Payable: ₹27,000 − ₹1,350 = ₹25,650.

