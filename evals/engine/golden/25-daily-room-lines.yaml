# A room billed one line per day, which is common: four lines of one day
# each at ₹4,000, 16 to 19 February. Each line covers its quantity of days
# from its service date, so together they cover 4 days, one fewer than the
# segment's 5 calendar days (the discharge day isn't billed). Nothing is
# flagged, and the bucket is under its cap.
#
# Counting the most days on any one line (1), as session 3 did, would have
# capped the room at ₹5,000, scaled the surgeon's fee by ₹5,000 ÷ ₹16,000,
# flagged all four lines and paid ₹19,593.75.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day. Stay 16 to 20
# February: 5 calendar days.
#
# Step 2, daily caps: the room lines cover 4 days together, billed
#   ₹16,000; the allowance is min(4, 5) × ₹5,000 = ₹20,000. No deduction.
# Step 3, proportionate deduction: ratio ₹5,000 × 4 days billed ÷ ₹16,000,
#   at most 1, so 1. L05 isn't scaled.
# Subtotal: 4 × ₹4,000 + ₹50,000 = ₹66,000.
# Step 6, co-payment: 5% of ₹66,000 = ₹3,300. Every share is exact:
#   L01 to L04 ₹200 each, L05 ₹2,500.
# Payable: ₹66,000 − ₹3,300 = ₹62,700.

