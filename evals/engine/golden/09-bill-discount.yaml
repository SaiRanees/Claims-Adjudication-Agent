# A bill-level discount, taken last, after the co-payment, and flagged.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day; the room is
# ₹3,000. Stay 2 to 5 February: 4 calendar days, 3 billed. The hospital took
# ₹1,000 off the whole bill.
#
# Steps 1 to 5 change nothing: ₹9,000 + ₹15,000 + ₹6,000 = ₹30,000.
# Step 6, co-payment: 5% of ₹30,000 = ₹1,500. Every share is exact:
#   L01 ₹450, L02 ₹750, L03 ₹300. The lines are now ₹8,550, ₹14,250 and
#   ₹5,700: ₹28,500.
# The bill discount: the smaller of the discount (₹1,000) and the payable
#   (₹28,500), spread by amount. Every share is exact: L01 ₹300, L02 ₹500,
#   L03 ₹200. It cites Definition 26: a discount was never "actually
#   incurred". bill_discount carries the discount, ₹1,000.
# Payable: ₹28,500 − ₹1,000 = ₹27,500.

