# A package line that an Annexure A list has already zeroed: an admission
# kit (List II item 27, "Not Payable") billed at a package rate. Step 1
# deducts it under annexure-a-list-ii. The step that sets aside unmodelled
# lines then finds nothing left, so it deducts nothing and raises no
# package_rate: the list's adjustment stays the line's reason.
#
# Sum insured ₹3,00,000: the room cap is the lower of 2% (₹6,000) and
# ₹5,000, so ₹5,000 a day; the room is ₹3,000. Stay 15 to 17 December:
# 3 calendar days, 2 billed.
#
# Step 1, listed items: L02 ₹2,500 → annexure-a-list-ii ₹2,500.
# Unmodelled lines: L02 is billed at a package rate but has nothing left.
#   No adjustment and no flag.
# Step 2, daily caps: L01 ₹6,000, under 2 × ₹5,000 = ₹10,000. No deduction.
# Step 3, proportionate deduction: ratio ₹6,000 ÷ ₹6,000 = 1, so nothing is
#   scaled.
# Subtotal: ₹6,000 + ₹0 + ₹15,000 + ₹4,500 = ₹25,500.
# Step 6, co-payment: 5% of ₹25,500 = ₹1,275. Every share is exact:
#   L01 ₹300, L02 nothing, L03 ₹750, L04 ₹225.
# Payable: ₹25,500 − ₹1,275 = ₹24,225.

