# A room rate one rupee over the cap, at a hospital whose billing practice
# isn't known: a ratio just under one still scales each line, rounded once,
# and the engine follows the wording and flags the unknown.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day. Stay 6 to 8
# October: 3 calendar days, 2 billed at ₹5,001.
#
# Step 2, daily caps: L01 billed 2 × ₹5,001 = ₹10,002; capped at
#   2 × ₹5,000 = ₹10,000. daily-cap-room ₹2 (200 paise) on L01.
# Step 3, proportionate deduction: the facts don't say whether the hospital
#   uses differential billing, so the step follows the wording (Note 2) and
#   raises differential_billing_unknown. Ratio 1,000,000 ÷ 1,000,200:
#     L02 4,000,000 × 1,000,000 ÷ 1,000,200 = 3,999,200.16 → 3,999,200,
#       proportionate-deduction-room 800 paise
#     L03 1,500,000 × 1,000,000 ÷ 1,000,200 = 1,499,700.06 → 1,499,700,
#       proportionate-deduction-room 300 paise
#   L04 pharmacy is exempt.
# Subtotal: 1,000,000 + 3,999,200 + 1,499,700 + 800,000 = 7,298,900 paise.
# Step 6, co-payment: 5% of 7,298,900 = 364,945 paise, exactly. Every share
#   is exact: L01 50,000, L02 199,960, L03 74,985, L04 40,000.
# Payable: 7,298,900 − 364,945 = 6,933,955 paise (₹69,339.55).

