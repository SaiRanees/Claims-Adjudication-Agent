# Annexure A List III, items subsumed into procedure charges: a microscope
# cover, item 11, "Payable Under OT Charges, Not Payable Separately". Billed
# as a line of its own, it pays nothing; C.I.7 folds it into the
# procedure's charges. Its adjustment cites the list.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day; the room is
# ₹4,000. Stay 23 to 25 June: 3 calendar days, 2 billed.
#
# Step 1, listed items: L03 ₹1,500 → annexure-a-list-iii ₹1,500.
# Step 2, daily caps: L01 ₹8,000, under 2 × ₹5,000 = ₹10,000. No deduction.
# Step 3, proportionate deduction: ratio ₹8,000 ÷ ₹8,000 = 1, so nothing is
#   scaled.
# Subtotal: ₹8,000 + ₹20,000 + ₹0 + ₹30,000 = ₹58,000.
# Step 6, co-payment: 5% of ₹58,000 = ₹2,900. Every share is exact:
#   L01 ₹400, L02 ₹1,000, L03 nothing, L04 ₹1,500.
# Payable: ₹58,000 − ₹2,900 = ₹55,100.

