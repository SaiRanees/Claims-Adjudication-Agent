# A listed modern treatment (C.I.6) over its limit: a robotic surgery,
# after ₹10,000 of the limit was used earlier in the policy year.
#
# Sum insured ₹2,00,000: the C.I.6 limit is 50%, ₹1,00,000 for the policy
# year, less the ₹10,000 used, so ₹90,000 is left. An earlier claim paid
# ₹9,500 this year. The room cap is the lower of 2% (₹4,000) and ₹5,000,
# so ₹4,000 a day; the room is ₹4,000. Stay 1 to 4 December: 4 calendar
# days, 3 billed.
#
# Steps 2 and 3: the room is at its cap, not over it, so nothing is
#   deducted or scaled.
# Step 4, sub-limits: L02, L03 and L04 are tied to the modern treatment:
#   ₹80,000 + ₹30,000 + ₹10,000 = ₹1,20,000, against ₹90,000 left. The
#   ₹30,000 reduction is spread by amount, exactly:
#   sub-limit-modern-treatment L02 ₹20,000, L03 ₹7,500, L04 ₹2,500. The
#   tied lines are now ₹60,000, ₹22,500 and ₹7,500. L01 and L05 aren't
#   tied to it.
# Admissible: ₹12,000 + ₹60,000 + ₹22,500 + ₹7,500 + ₹8,000 = ₹1,10,000,
#   under the ₹1,90,500 of cover left.
# Step 6, co-payment: 5% of ₹1,10,000 = ₹5,500. Every share is exact:
#   L01 ₹600, L02 ₹3,000, L03 ₹1,125, L04 ₹375, L05 ₹400.
# Payable: ₹1,10,000 − ₹5,500 = ₹1,04,500.
# Ledger: the C.I.6 use is what the tied lines were admitted at before the
# co-payment, ₹90,000, so the limit is used up for the year.

