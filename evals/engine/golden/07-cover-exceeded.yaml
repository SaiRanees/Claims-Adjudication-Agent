# The admissible amount exceeds the cover left: the cap comes before the
# co-payment, and cover_exceeded carries the co-pay-first payable
# (ADR 0009, whose example this is).
#
# Sum insured ₹5,00,000, no cumulative bonus, and ₹4,00,000 already paid
# this policy year: ₹1,00,000 of cover left. Stay 12 to 14 January:
# 3 calendar days, 2 billed at ₹4,000, under the ₹5,000 room cap.
#
# Steps 1 to 4 change nothing: the admissible total is
#   ₹8,000 + ₹60,000 + ₹34,000 = ₹1,02,000.
# Step 5, cap at the cover left: ₹1,02,000 capped at ₹1,00,000. The ₹2,000
#   (200,000 paise) reduction is spread by amount:
#     L01 15,686.2745   L02 117,647.0588   L03 66,666.6667
#   The floors add to 199,999; the paisa left goes to L03 (.6667).
#   cap-cover-left: L01 15,686, L02 117,647, L03 66,667. The lines are now
#   784,314 + 5,882,353 + 3,333,333 = 10,000,000 paise.
# Step 6, co-payment: 5% of ₹1,00,000 = ₹5,000 (500,000 paise), spread:
#     L01 39,215.70   L02 294,117.65   L03 166,666.65
#   The floors add to 499,998. The 2 paise left go to L01 (.70) and then,
#   of the tie at .65, to the earlier line, L02: 39,216, 294,118 and
#   166,666.
# Payable: ₹1,00,000 − ₹5,000 = ₹95,000.
#
# cover_exceeded's figure, the co-pay-first order after the same discount
# (none): 5% of ₹1,02,000 is ₹5,100, leaving ₹96,900, which is under the
# ₹1,00,000 cover left, so ₹96,900 (9,690,000 paise).
# The ledger's paid amount is the payable, ₹95,000, so ₹5,000 of cover is
# left for a later claim.

