    - {id: L02, category: professional-fees, service_date: 2026-01-13, quantity: 1, unit_price_paise: 6000000, amount_paise: 6000000}
    - {id: L03, category: pharmacy-consumables, service_date: 2026-01-13, quantity: 1, unit_price_paise: 3400000, amount_paise: 3400000}

