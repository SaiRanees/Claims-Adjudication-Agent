# A line dated outside the stay. Pre- and post-hospitalisation expenses
# aren't modelled (a v1 non-goal), so the step that sets aside unmodelled
# lines deducts the whole line under unmodelled-outside-stay, which cites
# no clause, and raises outside_stay on it. A person decides whether it is
# payable. A line dated on the discharge day is inside the stay.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day; the room is
# ₹4,000. Stay 20 to 23 October: 4 calendar days, 3 billed.
#
# Unmodelled lines, before step 2: L04, medicines bought on 24 October, the
#   day after discharge, is outside the stay. unmodelled-outside-stay
#   ₹2,500, and outside_stay on L04. L03, a scan on 23 October, the
#   discharge day, stays.
# Step 2, daily caps: L01 ₹12,000, under 3 × ₹5,000 = ₹15,000. No deduction.
# Step 3, proportionate deduction: ratio ₹12,000 ÷ ₹12,000 = 1, so nothing
#   is scaled.
# Subtotal: ₹12,000 + ₹28,000 + ₹5,000 + ₹0 = ₹45,000.
# Step 6, co-payment: 5% of ₹45,000 = ₹2,250. Every share is exact:
#   L01 ₹600, L02 ₹1,400, L03 ₹250, L04 nothing.
# Payable: ₹45,000 − ₹2,250 = ₹42,750. Other lines pay, so the claim isn't a
#   proposed denial.

