# The co-payment is rounded once for the claim, then spread. Taking 5% of
# each line and rounding each would take a paisa more.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day; the room is
# ₹1,010.10. Stay 2 to 4 March: 3 calendar days, 2 billed.
#
# Steps 1 to 5 change nothing: 202,020 + 101,010 + 101,010 = 404,040 paise.
# Step 6, co-payment: 5% of 404,040 = 20,202 paise, exactly.
#   Line by line it would be 10,101 + 5,050.5 → 5,051 + 5,050.5 → 5,051 =
#   20,203: a paisa more.
#   Spread by amount: L01 10,101, L02 5,050.5, L03 5,050.5. The floors add
#   to 20,201; the paisa left goes to the earlier of the tied lines, L02:
#   10,101, 5,051 and 5,050.
# Payable: 404,040 − 20,202 = 383,838 paise (₹3,838.38).

