# A move from the ward to the ICU. The transfer day belongs to the new room,
# so the ICU segment starts on 22 January, and a line dated that day takes
# the ICU ratio. Scaling by an ICU ratio raises icu_ratio_scaling
# (ADR 0010).
#
# Sum insured ₹1,50,000: the room cap is the lower of 2% (₹3,000) and
# ₹5,000, so ₹3,000 a day; the ICU cap is the lower of 5% (₹7,500) and
# ₹10,000, so ₹7,500 a day. Stay 19 to 24 January:
#   ward, 19 to 21 January: 3 calendar days, the room billed for 3 at
#   ₹4,000 (accepted: the days billed equal the segment's days);
#   ICU, 22 to 24 January: 3 calendar days, the ICU billed for 2 at ₹9,000
#   (accepted: one fewer, the discharge day).
#
# Step 2, daily caps, per segment:
#   ward: L01 ₹12,000 capped at 3 × ₹3,000 = ₹9,000. daily-cap-room ₹3,000.
#   ICU: L02 ₹18,000 capped at 2 × ₹7,500 = ₹15,000. daily-cap-icu ₹3,000.
# Step 3, proportionate deduction, each line by its own segment's ratio:
#   ward ratio ₹9,000 ÷ ₹12,000 = 75%. L03, dated 20 January:
#     ₹12,000 × 75% = ₹9,000, so proportionate-deduction-room ₹3,000.
#   ICU ratio ₹15,000 ÷ ₹18,000 = 5/6. L04, dated on the transfer day:
#     3,000,000 × 1,500,000 ÷ 1,800,000 = 2,500,000 exactly, so
#     proportionate-deduction-icu ₹5,000. Had the transfer day stayed in the
#     ward, L04 would have taken 75%: ₹22,500.
#   L02 is capped, never scaled (ADR 0010). L05 pharmacy is exempt.
#   icu_ratio_scaling carries the total ICU-ratio deduction, ₹5,000.
# Subtotal: ₹9,000 + ₹15,000 + ₹9,000 + ₹25,000 + ₹15,000 = ₹73,000.
# Step 6, co-payment: 5% of ₹73,000 = ₹3,650. Every share is exact:
#   L01 ₹450, L02 ₹750, L03 ₹450, L04 ₹1,250, L05 ₹750.
# Payable: ₹73,000 − ₹3,650 = ₹69,350.

