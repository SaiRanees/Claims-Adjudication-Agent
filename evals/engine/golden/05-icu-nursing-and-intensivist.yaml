# The review's ICU example: ICU ₹12,000, an intensivist ₹2,000 and nursing
# ₹1,000 a day pay ₹10,000 a day, not about ₹12,667.
#
# Definition 24 counts intensivist and critical-care nursing charges as ICU
# charges. Extraction classes the intensivist as icu-charges (L02). The
# nursing line (L03) is in the room bucket's category but dated on an ICU
# day, so it raises bucket_segment_mismatch and is held to both caps. It
# takes the ICU cap's cut before the ICU's own lines (ADR 0011).
#
# Sum insured ₹5,00,000: the ICU cap is the lower of 5% (₹25,000) and
# ₹10,000, so ₹10,000 a day; the room cap is ₹5,000 a day. The whole stay,
# 1 to 3 July, is in ICU: 3 calendar days, 2 billed.
#
# Step 2, daily caps:
#   L03 first meets its own bucket's cap: 2 × ₹5,000 = ₹10,000, above its
#   ₹2,000, so daily-cap-room deducts nothing.
#   Then the ICU bucket: L01 2,400,000 + L02 400,000 + L03 200,000 =
#   3,000,000 paise (₹15,000 a day); capped at 2 × ₹10,000 = 2,000,000, a
#   1,000,000 reduction.
#   L03, held to both caps, takes it first, up to its 200,000: all of it.
#   The 800,000 left is spread across the ICU's own lines by amount,
#   800,000 × 2,400,000 ÷ 2,800,000 and 800,000 × 400,000 ÷ 2,800,000:
#     L01 685,714.2857   L02 114,285.7143
#   The floors add to 799,999; the paisa left goes to L02 (.7143).
#   daily-cap-icu: L01 685,714, L02 114,286, L03 200,000.
#   The bucket pays 2,000,000 paise, ₹10,000 a day, all of it to the ICU's
#   own charges.
#   (Before ADR 0011 the 1,000,000 was spread across all three lines by
#   amount: L01 800,000, L02 133,333 and L03 66,667, so L03 paid 126,666.
#   Before the session 2 fix, nursing sat in a room bucket of its own and
#   the intensivist, billed as a fee, was scaled by ₹10,000 ÷ ₹12,000:
#   ₹10,000 + ₹1,000 + ₹1,666.67 ≈ ₹12,667 a day.)
# Step 3: nothing is left to scale (L04 pharmacy is exempt), so no ICU-ratio
#   deduction and no icu_ratio_scaling flag.
# Subtotal: 1,714,286 + 285,714 + 0 + 600,000 = 2,600,000 paise.
# Step 6, co-payment: 5% = 130,000, spread by amount (each line's 5%):
#     L01 85,714.3   L02 14,285.7   L03 0   L04 30,000
#   The floors add to 129,999; the paisa left goes to L02 (.7).
# Payable: 2,600,000 − 130,000 = 2,470,000 paise (₹24,700).
#   L01 1,714,286 − 85,714 = 1,628,572
#   L02   285,714 − 14,286 =   271,428
#   L03         0 −      0 =         0
#   L04   600,000 − 30,000 =   570,000

