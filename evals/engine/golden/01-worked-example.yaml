# The worked example in docs/plan/architecture.md, line by line.
#
# Sum insured ₹5,00,000, so the room cap is the lower of 2% (₹10,000) and
# ₹5,000: ₹5,000 a day. Four days in an ₹8,000 room, at a hospital that bills
# by room category. Stay 10 to 14 June: 5 calendar days, 4 billed (the
# discharge day isn't billed), so the cap counts min(4, 5) = 4 days.
#
# Step 1, listed items (Annexure A): L05, the admission kit, is List II
#   item 27. It pays nothing: annexure-a-list-ii ₹2,000.
# Step 2, daily caps: room bucket L01 billed 4 × ₹8,000 = ₹32,000; capped
#   at 4 × ₹5,000 = ₹20,000. daily-cap-room ₹12,000 on L01.
# Step 3, proportionate deduction: ratio = capped bucket ÷ billed bucket =
#   ₹20,000 ÷ ₹32,000 = 62.5%. L02 professional fees ₹1,00,000 × 20,000 ÷
#   32,000 = ₹62,500, so proportionate-deduction-room ₹37,500. L03 pharmacy
#   and L04 diagnostics are exempt (Note 2).
# Steps 4 and 5: no sub-limit applies; ₹1,22,500 is under the ₹5,00,000 of
#   cover left.
# Step 6, co-payment: 5% of ₹1,22,500 = ₹6,125, spread by each line's amount
#   so far: L01 5% of ₹20,000 = ₹1,000; L02 5% of ₹62,500 = ₹3,125;
#   L03 5% of ₹30,000 = ₹1,500; L04 5% of ₹10,000 = ₹500; L05 nothing. Every
#   share is exact.
# Payable: ₹1,22,500 − ₹6,125 = ₹1,16,375.
#
# | Line | Billed   | Payable  |
# | L01  | 32,000   | 19,000   |
# | L02  | 1,00,000 | 59,375   |
# | L03  | 30,000   | 28,500   |
# | L04  | 10,000   | 9,500    |
# | L05  | 2,000    | 0        |
# | All  | 1,74,000 | 1,16,375 |

