# The first day after case 45's wait: the same hernia repair and the same
# cover, continuous since 29 February 2024, so the 24-month wait (Excl02)
# runs through 28 February 2026; this admission, on 1 March 2026, is
# covered. It falls in the policy year that begins that day.
#
# Sum insured ₹3,00,000, so the room cap is the lower of 2% (₹6,000) and
# ₹5,000: ₹5,000 a day. A 2-day stay, the room billed for 1 day.
#
# Eligibility: the only tranche is past every wait that applies.
# Steps 2 and 3: the room, ₹4,000, is under its cap, so nothing is capped
#   or scaled.
# Subtotal: ₹4,000 + ₹30,000 = ₹34,000.
# Step 6, co-payment: 5% of ₹34,000 = ₹1,700. Every share is exact:
#   L01 ₹200, L02 ₹1,500.
# Payable: ₹34,000 − ₹1,700 = ₹32,300.

