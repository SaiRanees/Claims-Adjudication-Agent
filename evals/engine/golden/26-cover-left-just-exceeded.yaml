# An admissible total one paisa over the cover left. The cap comes before
# the co-payment, so the co-payment is 5% of the cover left, and
# cover_exceeded carries the co-pay-first payable (ADR 0009).
#
# Sum insured ₹2,00,000, a cumulative bonus of ₹20,000 for the year, and
# ₹1,70,000 already paid this policy year: the cover left is ₹2,00,000 +
# ₹20,000 − ₹1,70,000 = ₹50,000. The room cap is the lower of 2% (₹4,000)
# and ₹5,000, so ₹4,000 a day; the room is ₹3,000. Stay 16 to 18 March:
# 3 calendar days, 2 billed.
#
# Steps 1 to 4 change nothing: 600,000 + 3,000,000 + 1,400,001 = 5,000,001
#   paise admissible.
# Step 5, cap at the cover left: 5,000,001 capped at 5,000,000. The 1 paisa
#   is spread by amount; every share floors to 0, and the paisa goes to the
#   largest remainder, the largest line: cap-cover-left 1 paisa on L02.
#   The lines are now 600,000, 2,999,999 and 1,400,001.
# Step 6, co-payment: 5% of 5,000,000 = 250,000 paise, spread:
#     L01 30,000   L02 149,999.95   L03 70,000.05
#   The floors add to 249,999; the paisa left goes to L02 (.95): 30,000,
#   150,000 and 70,000.
# Payable: 5,000,000 − 250,000 = 4,750,000 paise (₹47,500).
#
# cover_exceeded's figure, co-pay-first after the same discount (none):
# 5% of 5,000,001 is 250,000.05, rounded to 250,000, leaving 4,750,001,
# under the cover left, so 4,750,001 paise: a paisa more than the payable.

