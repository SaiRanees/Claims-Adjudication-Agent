    - {id: L02, category: professional-fees, service_date: 2026-03-17, quantity: 1, unit_price_paise: 3000000, amount_paise: 3000000}
    - {id: L03, category: pharmacy-consumables, service_date: 2026-03-17, quantity: 1, unit_price_paise: 1400001, amount_paise: 1400001}

