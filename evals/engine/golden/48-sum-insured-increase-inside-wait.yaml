# A sum-insured increase still inside its waiting period. The base ₹2,00,000
# has run since 1 April 2022; the ₹3,00,000 added at the 1 April 2025
# renewal restarts the waits for the added amount (Excl02(b)). The claim is
# a hernia repair (24-month list, item 12) admitted on 4 August 2025:
#   the base is past its 24-month wait, which ran through 31 March 2024;
#   the increase is inside its own, which runs through 31 March 2027.
# So only the base counts: the eligible sum insured is ₹2,00,000, the
# increase raises tranche_excluded carrying its ₹3,00,000, and the
# percentage limits use ₹2,00,000. No line is deducted for eligibility.
#
# The room cap is the lower of 2% of ₹2,00,000 (₹4,000) and ₹5,000:
# ₹4,000 a day. On the full ₹5,00,000 it would be ₹5,000, the room would be
# under it, nothing would be scaled, and the claim would pay ₹45,600. Stay
# 4 to 6 August: 3 calendar days, the room billed for 2 at ₹5,000.
#
# Step 2, daily caps: L01 ₹10,000 capped at 2 × ₹4,000 = ₹8,000.
#   daily-cap-room ₹2,000.
# Step 3, proportionate deduction: ratio ₹4,000 × 2 days billed ÷ ₹10,000 =
#   80%. L02 ₹30,000 × 80% = ₹24,000, so proportionate-deduction-room
#   ₹6,000. L03 pharmacy is exempt.
# Step 5: ₹8,000 + ₹24,000 + ₹8,000 = ₹40,000, under the ₹2,00,000 of
#   cover left.
# Step 6, co-payment: 5% of ₹40,000 = ₹2,000. Every share is exact:
#   L01 ₹400, L02 ₹1,200, L03 ₹400.
# Payable: ₹40,000 − ₹2,000 = ₹38,000.

policy:
  wording_uin: GODHLIP24179V022324
  period_start: 2025-04-01
  period_end: 2026-03-31

cover:
  tranches:
    - sum_insured_paise: 20000000
      continuous_since: 2022-04-01
    # The increase at the 1 April 2025 renewal.
    - sum_insured_paise: 30000000
      continuous_since: 2025-04-01

facts:
  admission: 2025-08-04
  discharge: 2025-08-06
  segments:
    - {from: 2025-08-04, to: 2025-08-06, kind: room}
  differential_billing: yes
  condition:
    listed_group: listed-24-months
  lines:
    - {id: L01, category: room-rent, service_date: 2025-08-04, quantity: 2, unit_price_paise: 500000, amount_paise: 1000000}
    - {id: L02, category: professional-fees, service_date: 2025-08-05, quantity: 1, unit_price_paise: 3000000, amount_paise: 3000000}
    - {id: L03, category: pharmacy-consumables, service_date: 2025-08-05, quantity: 1, unit_price_paise: 800000, amount_paise: 800000}

expected:
  lines:
    - {id: L01, payable_paise: 760000}
    - {id: L02, payable_paise: 2280000}
    - {id: L03, payable_paise: 760000}
  adjustments:
    - {line: L01, rule: daily-cap-room, paise: 200000}
    - {line: L02, rule: proportionate-deduction-room, paise: 600000}
    - {line: L01, rule: co-payment, paise: 40000}
    - {line: L02, rule: co-payment, paise: 120000}
    - {line: L03, rule: co-payment, paise: 40000}
  flags:
