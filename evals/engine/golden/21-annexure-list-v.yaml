# Annexure A List V, additional non-payable items: AHD, item 23, "Ancillary
# And Hospital Disinfection (Eg., Biomedical Waste Disposal/Management,
# Sanitation, Sanitization/Fumigation Charges Etc.)". C.I.7 doesn't mention
# List V, so the adjustment cites the list alone.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day; the room is
# ₹4,500. Stay 9 to 11 March: 3 calendar days, 2 billed.
#
# Step 1, listed items: L02 ₹750 → annexure-a-list-v ₹750.
# Step 2, daily caps: L01 ₹9,000, under 2 × ₹5,000 = ₹10,000. No deduction.
# Step 3, proportionate deduction: ratio ₹9,000 ÷ ₹9,000 = 1, so nothing is
#   scaled.
# Subtotal: ₹9,000 + ₹0 + ₹22,000 + ₹7,000 = ₹38,000.
# Step 6, co-payment: 5% of ₹38,000 = ₹1,900. Every share is exact:
#   L01 ₹450, L02 nothing, L03 ₹1,100, L04 ₹350.
# Payable: ₹38,000 − ₹1,900 = ₹36,100.

