# More days billed than the segment has, with a scaled line: the ratio
# follows Note 2, "the admissible rate per day bears to the actual rate per
# day", so it counts the days billed. The allowance still counts only the
# segment's days, and 5 days billed for 4 raises room_days_mismatch on L01.
#
# Sum insured ₹5,00,000, so the room cap is ₹5,000 a day. Stay 5 to 8
# January: 4 calendar days, billed for 5 at ₹8,000.
#
# Step 2, daily caps: L01 billed 5 × ₹8,000 = ₹40,000; capped at
#   min(5, 4) = 4 × ₹5,000 = ₹20,000. daily-cap-room ₹20,000 on L01.
# Step 3, proportionate deduction: ratio = ₹5,000 × 5 days billed ÷
#   ₹40,000 = 2,500,000 ÷ 4,000,000 = 62.5%, which is the rate per day,
#   ₹5,000 ÷ ₹8,000.
#   L02 4,000,000 × 2,500,000 ÷ 4,000,000 = 2,500,000 exactly (₹25,000), so
#   proportionate-deduction-room ₹15,000. L03 pharmacy is exempt.
#   The capped total over the billed total, ₹20,000 ÷ ₹40,000 = 50%, would
#   have paid L02 ₹20,000.
# Subtotal: ₹20,000 + ₹25,000 + ₹6,000 = ₹51,000.
# Step 6, co-payment: 5% of ₹51,000 = ₹2,550. Every share is exact:
#   L01 ₹1,000, L02 ₹1,250, L03 ₹300.
# Payable: ₹51,000 − ₹2,550 = ₹48,450.

